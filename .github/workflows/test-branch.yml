on:
  pull_request:
  push:
    branches:
      - main
      - release
jobs:
  test:
    runs-on: ubuntu-latest
    name: testing and linting this branch
    steps:
      - name: check out this repo
        uses: actions/checkout@v6
      - name: setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.26.0"
          cache-dependency-path: backend/go.sum
      - name: compile the go backend
        run: |
          uv run make.py build_go_ci
      - name: run go tests
        run: |
          uv run make.py test
      - name: install shellcheck
        run: |
          sudo apt install -y shellcheck
      - name: run shellcheck
        run: |
          find -name '*.sh' -and -not -path '*/node_modules/*' | xargs shellcheck
      - name: lint repo
        run: |
          uv run make.py lint
      - name: compile the frontend
        run: |
          uv run make.py build_frontend
      - name: check for TODO string instances
        run: |
          git ls-files | grep -v test-branch\.yml | xargs grep -Ii todo | wc -l | xargs uv run python3 -c "import sys; sys.exit(0 if int(sys.argv[1]) == 0 else 1)"
