name: Update release-linux-glibc-x86_64 on version change

on:
  push:
    branches:
      - main
    paths:
      - "backend2/src/consts.rs"

jobs:
  update-release-linux-glibc-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend2
      - name: merge main into release
        run: |
          git remote set-url origin git@github.com:steve4650/gnuplex.git
          git config user.name "release workflow"
          git config user.email "x@example.com"
          git checkout release-linux-glibc-x86_64
          git merge main -X theirs --allow-unrelated-histories
      - name: build gnuplex
        run: |
          uv run make.py build
      - name: update release branch
        run: |
          umask 077
          echo "${{ secrets.GNUPLEX_DEPLOY }}" >/tmp/gnuplex-deploy
          version_output=$(./backend2/bin/gnuplex -version)
          git add .
          git add -f backend2/bin backend2/static
          git commit -m "$version_output"
          GIT_SSH_COMMAND="ssh -i /tmp/gnuplex-deploy" git push origin release-linux-glibc-x86_64
          rm /tmp/gnuplex-deploy
