[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Rust rewrite of the GNUPlex backend"

[[bin]]
name = "gnuplex"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subcue = "0.1.1"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
